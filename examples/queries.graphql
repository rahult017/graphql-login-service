
# ============================================================================
# EXAMPLE 1: D2C User Login (Simple Success)
# ============================================================================

mutation D2C_Login {
  login(input: {
    identifier: "alice@gmail.com"
    secret: "SecurePass123!"
    metadata: {
      ipAddress: "203.0.113.1"
      deviceFingerprint: "alice_laptop_chrome"
      userAgent: "Mozilla/5.0..."
    }
  }) {
    ... on LoginSuccess {
      __typename
      correlationId
      timestamp
      success
      sessionToken
      expiresIn
      user {
        id
        email
        name
        accountType
        mfaEnrolled
      }
      organization {
        id
        name
      }
    }
    ... on LoginFailure {
      __typename
      correlationId
      errorCode
      message
      retryAllowed
    }
  }
}

# Expected Response:
# {
#   "data": {
#     "login": {
#       "__typename": "LoginSuccess",
#       "success": true,
#       "sessionToken": "eyJhbGc...",
#       "user": {
#         "email": "alice@gmail.com",
#         "accountType": "D2C"
#       },
#       "organization": null
#     }
#   }
# }


# ============================================================================
# EXAMPLE 2: B2B Single-Org Login (Success)
