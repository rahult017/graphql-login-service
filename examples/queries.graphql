# ============================================================================
# EXAMPLE 9: Refresh Session
# ============================================================================

mutation RefreshSession {
  refreshSession(refreshToken: "ref_abc123...") {
    ... on LoginSuccess {
      sessionToken
      expiresIn
    }
    ... on LoginFailure {
      errorCode
    }
  }
}

