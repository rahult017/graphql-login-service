# ============================================================================
# EXAMPLE 8: IP Restricted
# ============================================================================

mutation IPRestricted_Login {
  login(input: {
    identifier: "eve@finance.com"
    secret: "FinancePass999!"
    metadata: {
      ipAddress: "203.0.113.100"  # Not in whitelist
    }
  }) {
    ... on LoginFailure {
      errorCode
      message
    }
  }
}

